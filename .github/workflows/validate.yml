# Structural and privacy checks for the skills. This repository is public and holds no data,
# so the check that matters most is that no private path has crept in.
name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install yaml
        run: Rscript -e 'install.packages("yaml")'

      - name: Validate
        run: Rscript config/validate-skills.R
